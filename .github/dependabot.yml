# This file is centrally managed by the altitude-travel/github-policies
# repository and will be overwritten on every policy sync. Do not edit it
# here — propose changes in github-policies instead.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "**/*"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "npm"
      - "dependencies"
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "🧹 chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "github-actions"
      - "dependencies"
    groups:
      all-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "🔧 ci"
      include: "scope"

  - package-ecosystem: "terraform"
    directories:
      - "/"
      - "**/*"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "terraform"
      - "dependencies"
    groups:
      all-providers:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "🏗️ infra"
      include: "scope"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "**/*"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "docker"
      - "dependencies"
    groups:
      all-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "🐳 docker"
      include: "scope"

  - package-ecosystem: "swift"
    directories:
      - "/"
      - "**/*"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "swift"
      - "dependencies"
    groups:
      all-packages:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "🧹 chore"
      include: "scope"
